<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEINATOR - Collaborative Code Editor</title>
    <script>
        // Get the current URL
        var currentUrl = window.location.pathname;
        console.log('404 handler - Current URL:', currentUrl);
        
        // If it's a room URL (starts with 'room-'), redirect to base with the room ID
        if (currentUrl.includes('/room-')) {
            var roomId = currentUrl.split('/room-')[1];
            console.log('404 handler - Extracted room ID:', roomId);
            // Redirect to base app with room ID as hash
            window.location.href = '/collaborative-code-editor/#room-' + roomId;
        } else {
            // Redirect to base URL
            window.location.href = '/collaborative-code-editor/';
        }
    </script>
</head>
<body>
    <div>
        <h1>Redirecting to CODEINATOR...</h1>
        <p>If you're not redirected, <a href="/collaborative-code-editor/">click here</a>.</p>
    </div>
</body>
</html>
